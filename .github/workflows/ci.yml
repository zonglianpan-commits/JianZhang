name: Verify static PWA
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js && node --check sw.js && node --check cloud-sync.js && node --check cloud-config.js
      - name: Daily report and category drill-down regression tests
        run: node tests/report-daily.test.cjs
      - name: Verify manifest and asset paths
        run: |
          python3 -m json.tool manifest.webmanifest >/dev/null
          test -f index.html
          test -f download.html
          test -f styles.css
          test -f icons/icon-192.png
          test -f icons/icon-512.png
