name: JianZhang
options:
  bundleIdPrefix: com.jianzhang
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  JianZhang:
    type: application
    platform: iOS
    sources:
      - path: JianZhang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianzhang.ledger.ios
        INFOPLIST_FILE: JianZhang/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
    info:
      path: JianZhang/Info.plist
