<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#0a111c" />
  <meta name="description" content="见账：离线优先的资产、负债与日常记账工具。你的账本只存储在自己的设备中。" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>见账 · 每一笔都有数</title>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-symbol" aria-hidden="true">见</div><div><div class="brand-name">见账 <span>JIANZHANG</span></div><div class="brand-caption">让每一笔，都有数</div></div></div>
      <div class="top-actions"><a class="download-link" href="./download.html" title="下载和安装见账 App">下载 App</a><span class="local-pill"><span class="local-dot"></span> 仅本机保存</span><button class="avatar-btn" type="button" data-nav="settings" title="设置与备份" aria-label="设置与备份">⚙</button></div>
    </header>
    <main id="page-root" aria-live="polite"><div class="loading">正在打开你的账本…</div></main>
  </div>
  <nav class="bottom-nav" aria-label="主导航">
    <button type="button" class="nav-item active" data-nav="home" aria-label="总览" aria-current="page"><span class="nav-icon" data-icon="home"></span><small>总览</small></button>
    <button type="button" class="nav-item" data-nav="ledger" aria-label="账单"><span class="nav-icon" data-icon="list"></span><small>账单</small></button>
    <button type="button" class="nav-add" data-open="transaction" aria-label="新增记账">+</button>
    <button type="button" class="nav-item" data-nav="reports" aria-label="统计"><span class="nav-icon" data-icon="chart"></span><small>统计</small></button>
    <button type="button" class="nav-item" data-nav="settings" aria-label="设置"><span class="nav-icon" data-icon="settings"></span><small>我的</small></button>
  </nav>
  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./cloud-config.js" defer></script>
  <script src="./cloud-sync.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
